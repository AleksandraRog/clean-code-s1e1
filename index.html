<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
      rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen">
  </head>
  <body>
    <header class="header">
      <div class="layout-container">
        <img class="logo" src="./eisenhower-matrix.jpg"  alt="Eisenhower Matrix">
        <a class="more-info-link more_inf" 
          href="https://goal-life.com/page/method/matrix-eisenhower">
          Want more details&quest;
        </a>
      </div>
    </header>
    <main class="centered-main-page-element">
      <section class="todo-section todo-section_add layout-container">
        <label class="todo-section__title" for="new-task">Add Item</label>
        <div class="todo-section__item">
          <input id="new-task" class="todo-section__input" type="text">
          <button class="todo-section__add">Add</button>
        </div>
      </section>
      <section class="todo-section todo-section_tasks layout-container">
        <h3 class="todo-section__title">Todo</h3>
        <ul class="todo-list">
          <li class="todo-list__item">
            <input class="todo-list__check" type="checkbox">
            <label class="todo-list__content">Pay Bills</label>
            <input type="text" class="todo-list__input">
            <button class="todo-list__edit">Edit</button>
            <button class="todo-list__delete">
              <img class="todo-list__delete-icon" src="./remove.svg" alt="remove icon">
            </button>
          </li>
          <li class="todo-list__item todo-list__item_edit_mode">
            <input class="todo-list__check" type="checkbox">
            <label class="todo-list__content">Go Shopping</label>
            <input type="text" value="Go Shopping" class="todo-list__input">
            <button class="todo-list__edit">Save</button>
            <button class="todo-list__delete">
              <img class="todo-list__delete-icon" src="./remove.svg" alt="">
            </button>
          </li>
        </ul>
      </section>
      <section class="todo-section todo-section_completed layout-container">
        <h3 class="todo-section__title">Completed</h3>
        <ul class="todo-list">
        <li class="todo-list__item">
          <input class="todo-list__check" type="checkbox" checked>
          <label class="todo-list__content">See the Doctor</label>
          <input type="text" class="todo-list__input">
          <button class="todo-list__edit">Edit</button>
          <button class="todo-list__delete">
            <img class="todo-list__delete-icon" src="./remove.svg" alt="remove icon">
          </button>
        </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
